<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>웹 스케치북</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
/* Layout: 상단 바 + 블록 리본 + [페이지 탭 + 캔버스 | 속성 패널] 한 화면. 캔버스·패널은 내부 스크롤.
   Color: 편집기 UI는 차분한 초록 포인트(--accent), 학생이 만드는 페이지는 사이트 설정 색으로 완전히 분리.
   Type: 편집기 UI는 Noto Sans KR, 페이지는 사용자가 고른 제목/본문 글꼴. */
:root{
  --bg:#e8ebe8; --stage:#dde1dd; --panel:#ffffff; --panel2:#f3f5f3; --line:#dce1dd;
  --ink:#1a201c; --mute:#637069; --accent:#0e9a68; --accent-ink:#ffffff; --soft:#e3f4ec; --danger:#d63b30;
  --font:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121514; --stage:#0d100f; --panel:#1d2220; --panel2:#262c29; --line:#343c38;
    --ink:#e8eeea; --mute:#98a39c; --accent:#3ccb90; --accent-ink:#06261a; --soft:#1c3a2e; --danger:#ff7b6f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121514; --stage:#0d100f; --panel:#1d2220; --panel2:#262c29; --line:#343c38;
  --ink:#e8eeea; --mute:#98a39c; --accent:#3ccb90; --accent-ink:#06261a; --soft:#1c3a2e; --danger:#ff7b6f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- 상단 바 ---------- */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:9px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;letter-spacing:-.02em;margin-right:6px}
.logo i{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.sp{flex:1}
.ub{height:34px;min-width:34px;padding:0 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.ub:hover:not(:disabled){background:var(--panel2)}
.ub:disabled{opacity:.4;cursor:default}
.ub.pri,.ub.pri:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.ub.sec{border-color:var(--accent);color:var(--accent);font-weight:700}
.ub.danger{color:var(--danger)}
.selbtn{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 10px;font-size:13px;cursor:pointer}
.vt{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vt button{height:32px;padding:0 11px;border:0;background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.vt button svg{color:var(--mute)}
.vt button.on{background:var(--soft);font-weight:700}
.vt button.on svg{color:var(--accent)}
.only-narrow{display:none}

/* ---------- 블록 리본 ---------- */
.ribbon{display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding-block:6px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.rg{display:flex;align-items:center;gap:1px;padding-right:8px;margin-right:6px;border-right:1px solid var(--line);flex:none}
.rg.feat{background:var(--soft);border-right:0;border-radius:10px;padding:0 6px 0 2px;margin-right:10px}
.rg.feat .rb svg{color:var(--accent)}
.rgl{writing-mode:vertical-rl;white-space:nowrap;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.02em;padding:0 3px;flex:none}
.rg.feat .rgl{color:var(--accent)}
.rb{width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border:0;background:none;color:var(--ink);font-size:11px;border-radius:8px;cursor:pointer;flex:none;white-space:nowrap}
.rb svg{color:var(--mute)}
.rb:hover{background:var(--panel2)}
.rg.feat .rb:hover{background:var(--panel)}
.rb:hover svg{color:var(--accent)}

/* ---------- 본문 ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:12px;padding-block:12px}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:12px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:thin}
.pbar .seg{flex:none}
.ptabs{display:flex;gap:4px;flex:none}
.ptab{height:30px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ptab:hover{background:var(--panel2)}
.ptab.on,.ptab.on:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.ptab small{font-size:10.5px;opacity:.75;font-weight:400}
.ptab.add{border-style:dashed;color:var(--mute)}
.pbar .hint{white-space:nowrap}
.scroll{flex:1;min-height:0;overflow:auto}
.stage-in{padding:52px 24px 120px;display:flex;justify-content:center;min-width:min-content}
.view-m .stage-in{min-width:0}

/* ---------- 속성 패널 ---------- */
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:12px 6px;font-size:13px;font-weight:700;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1}
.pt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.pt svg{color:var(--accent)}
.pt .tagf{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);padding:2px 8px;border-radius:999px}
.pl{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.hint{font-size:12.5px;color:var(--mute);line-height:1.6}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;font-size:12.5px;padding:6px 4px;border-radius:6px;color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:700;color:var(--accent)}
.seg.mini button{padding:5px 11px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.none{background:linear-gradient(135deg,transparent 46%,var(--danger) 46%,var(--danger) 54%,transparent 54%),var(--panel)}
.sw.custom{background:conic-gradient(#f33,#fc0,#3c3,#0cf,#36f,#c3f,#f33);overflow:hidden}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.tin{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 10px;font-size:13px;min-width:0}
.tin.ta{height:72px;padding:8px 10px;resize:vertical;line-height:1.55}
.tin.num{flex:0 0 62px;width:62px}
.lrow{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.lrow>.tin{flex:1}
.lstack{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ib{width:34px;flex:none;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:8px;cursor:pointer;font-size:15px}
.ib.txt{width:auto;padding:0 8px;font-size:12px}
.ib.on{background:var(--soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.ib:disabled{opacity:.35;cursor:default}
.add{width:100%;height:32px;border:1px dashed var(--line);background:none;border-radius:8px;color:var(--mute);cursor:pointer;font-size:13px}
.add:hover{color:var(--accent);border-color:var(--accent)}
.pact{display:flex;gap:8px;margin-top:2px}
.pact .ub{flex:1}
.btnrow2{display:flex;gap:6px}
.btnrow2 .ub{flex:1}
.fxbox{display:flex;flex-direction:column;gap:14px;padding:12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.fxbox .seg{background:var(--panel)}
.fxbox .seg button.on{background:var(--soft)}
.fxbox .pt{font-size:13px}

/* ---------- 학생이 만드는 페이지 ---------- */
.page{--p-s:20px;--p-m:44px;--p-l:76px;--px:48px;flex:0 1 860px;min-width:0;position:relative;font-family:var(--bf);background:var(--sbg);color:var(--sfg);line-height:1.6;font-size:16px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 44px rgba(0,0,0,.16)}
.view-m .page{flex-basis:390px}
.page.narrow{--p-s:14px;--p-m:30px;--p-l:48px;--px:18px;font-size:15px}
.page .blk{position:relative;background:var(--bgc);color:var(--fg);padding:var(--py) var(--px)}
.page [data-f]{outline:none;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;min-width:1ch;cursor:text}
.page [data-f]:empty::before{content:attr(data-ph);opacity:.45}
.page.exp [data-f]:empty::before{content:none}
.page [data-f]:hover{outline:1px dashed rgba(128,128,128,.55);outline-offset:3px}
.page [data-f]:focus{outline:2px solid var(--accent);outline-offset:3px}
.page .hd{font-family:var(--hf);font-weight:var(--hw);line-height:1.25;letter-spacing:-.01em;margin:0}
.page .p{margin:0;line-height:1.75;max-width:44em}
.page .a-left{text-align:left}.page .a-center{text-align:center}.page .a-right{text-align:right}
.page .p.a-center{margin-inline:auto}.page .p.a-right{margin-left:auto}
.page .hs-s{font-size:26px}.page .hs-m{font-size:34px}.page .hs-l{font-size:46px}
.page.narrow .hs-s{font-size:21px}.page.narrow .hs-m{font-size:27px}.page.narrow .hs-l{font-size:34px}
.page .sz-s{font-size:15px}.page .sz-m{font-size:18px}.page .sz-l{font-size:22px}
.page.narrow .sz-s{font-size:14px}.page.narrow .sz-m{font-size:16px}.page.narrow .sz-l{font-size:19px}
.page .btn{display:inline-block;padding:12px 24px;border-radius:var(--br);font-weight:700;font-size:16px;line-height:1.3;background:var(--bt-b);color:var(--bt-f);border:2px solid var(--bt-b);white-space:nowrap}
.page .btn.line{background:transparent;color:var(--bt-b)}
.page .btn.sm{padding:7px 14px;font-size:14px}
.page .btn.wide{display:block;text-align:center}
.page .btnrow{display:flex}
.page .btnrow.a-center{justify-content:center}.page .btnrow.a-right{justify-content:flex-end}

.page .t-nav{border-bottom:1px solid var(--line)}
.page .nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px}
.page .brand{font-family:var(--hf);font-weight:var(--hw);font-size:22px}
.page .nav-r{display:flex;align-items:center;gap:20px}
.page .menu{display:flex;gap:22px;font-size:15px;flex-wrap:wrap}
.page .mi[data-goto]{cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
.page .mi.on{color:var(--ac);font-weight:700;border-bottom-color:var(--ac)}
.page [data-login]{cursor:pointer}
.page .burger{display:none}
.page .burger i{display:block;width:22px;height:2px;background:var(--fg);margin:5px 0}
.page.narrow .menu{display:none}.page.narrow .burger{display:block}
.page.narrow .nav-r{gap:12px}

.page .hero{min-height:var(--hh);display:flex;align-items:center}
.page.narrow .hero{min-height:calc(var(--hh) * .78)}
.page .hero-in{width:100%;display:flex;flex-direction:column;gap:16px}
.page .hero-in.a-left{align-items:flex-start;text-align:left}
.page .hero-in.a-center{align-items:center;text-align:center}
.page .h1{font-size:52px}.page.narrow .h1{font-size:33px}
.page .sub{margin:0;font-size:19px;opacity:.9;max-width:30em}
.page.narrow .sub{font-size:16px}

.page .cards{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:20px}
.page.narrow .cards{grid-template-columns:1fr}
.page .card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.page .card-b{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px}
.page .card h3{font-size:20px}
.page .card p{margin:0;font-size:15px;color:var(--mute);line-height:1.65}
.page .it{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.page .it.flip .slot{order:2}
.page .it-t{display:flex;flex-direction:column;gap:12px}
.page .it-t h3{font-size:28px}
.page .it-t p{margin:0;color:var(--mute);line-height:1.75}
.page.narrow .it{grid-template-columns:1fr;gap:20px}
.page.narrow .it.flip .slot{order:0}
.page .gal{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.page.narrow .gal{grid-template-columns:repeat(2,minmax(0,1fr))}

.page .slot{position:relative;width:100%;background-color:var(--ph);background-size:cover;background-position:center;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden}
.page .slot.cslot{border-radius:0}
.page .ph{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;max-width:92%;text-align:center;color:var(--mute);font-size:14px}
.page .imgbtn{position:absolute;right:10px;bottom:10px;height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;opacity:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.page .slot:hover .imgbtn,.page .blk.sel .imgbtn{opacity:1}
.page .slot.drop{outline:3px dashed var(--accent);outline-offset:-3px}

.page .q{margin:0 auto;max-width:640px}
.page .q.a-left{margin-inline:0}
.page .q::before{content:'\201C';display:block;font-family:var(--hf);font-size:72px;line-height:.7;height:34px;color:var(--ac)}
.page .qt{font-size:26px;line-height:1.45;margin:0}
.page.narrow .qt{font-size:20px}
.page .qw{font-size:14px;color:var(--mute);margin-top:14px;font-style:normal}
.page .dv hr{border:0;border-top:1px solid var(--line);margin:0}
.page .dv.dashed hr{border-top:2px dashed var(--bd)}
.page .dv.thick hr{border-top:5px solid var(--ac);width:72px;margin:0 auto}
.page .form{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.page .form h3{font-size:26px;text-align:center}
.page .fld{display:flex;flex-direction:column;gap:6px}
.page .fl{font-weight:700;font-size:14px}
.page .inp{height:44px;border:1px solid var(--bd);border-radius:calc(var(--r) * .5);background:var(--inbg)}
.page .inp.tall{height:110px}
.page .form .btnrow{margin-top:4px}
.page .ft{display:flex;flex-direction:column;gap:6px}
.page .ft.a-center{align-items:center}.page .ft.a-right{align-items:flex-end}
.page .ft strong{font-family:var(--hf);font-weight:var(--hw);font-size:19px}
.page .ft p{margin:0;font-size:14px;color:var(--mute)}
.page .tip{margin:28px max(var(--px),calc((100% - 760px) / 2));padding:20px 22px;border:2px dashed var(--accent);border-radius:14px;background:var(--soft);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;gap:8px;line-height:1.6}
.page .tip b{font-size:16px}
.page .tip span{font-size:14px;color:var(--mute)}
.page .tip em{font-style:normal;font-weight:700;color:var(--accent)}
.page .tipbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.page .tipbtns button{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:13px;cursor:pointer}
.page .tipbtns button svg{color:var(--accent)}
.page .tipbtns button:hover{border-color:var(--accent)}
.pb-add{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;padding-left:12px}
.page .empty{padding:80px 20px;text-align:center;color:#7d8680;font-family:var(--font);line-height:1.8}

/* 학급 기능 블록 */
.page .fx{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.page.narrow .fx{padding:16px}
.page .fx-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page .fx-t{display:flex;flex-direction:column;gap:8px;min-width:0}
.page .fx-h h3{font-size:23px}
.page.narrow .fx-h h3{font-size:20px}
.page .chips{display:flex;flex-wrap:wrap;gap:6px}
.page .chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);line-height:1.6;background:var(--bgc2)}
.page .fx.login{max-width:400px;gap:14px}
.page .login .lt{text-align:center;font-size:25px}
.page .rtab{display:flex;border:1px solid var(--bd);border-radius:calc(var(--r) * .5);overflow:hidden}
.page .rtab span{flex:1;text-align:center;padding:8px;font-size:14px}
.page .rtab .on{background:var(--bt-b);color:var(--bt-f);font-weight:700}
.page .lsub{text-align:center;font-size:13px;color:var(--mute)}
.page .vlist{display:flex;flex-direction:column;gap:8px}
.page .vopt{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:calc(var(--r) * .6);background:var(--inbg);overflow:hidden}
.page .vopt>*{position:relative}
.page .vbar{position:absolute!important;left:0;top:0;bottom:0;background:var(--ac);opacity:.16}
.page .radio{flex:none;width:18px;height:18px;border:2px solid var(--bd);border-radius:50%}
.page .radio.sq{border-radius:4px}
.page .vl{flex:1}
.page .vpct{font-weight:700;font-variant-numeric:tabular-nums}
.page .tblw{overflow-x:auto}
.page .tbl{width:100%;border-collapse:collapse;font-size:15px}
.page .tbl th{text-align:left;font-size:13px;color:var(--mute);font-weight:700;border-bottom:2px solid var(--bd);padding:8px}
.page .tbl td{border-bottom:1px solid var(--line);padding:11px 8px;vertical-align:top}
.page .tbl .num{width:48px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.page .tbl .date{width:72px;color:var(--mute);font-size:13px}
.page.narrow .tbl .w{display:none}
.page .cm{color:var(--ac);font-size:13px;font-weight:700;margin-left:6px}
.page .lk{color:var(--mute);font-size:12.5px;margin-left:8px}
.page .pager{display:flex;justify-content:center;gap:6px}
.page .pager span{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:13px;color:var(--mute)}

function bgOf(b){
 const v=b.bg; if(!v)return null; const ac=hex2rgb(S.accent);
 if(v==='accent')return ac;
 if(v==='tint')return mix(W,ac,.12);
 if(v==='gray')return[241,242,244];
 if(v==='dark')return[29,34,48];
 if(v==='white')return[255,255,255];
 return hex2rgb(v);
}
function bv(b){
 const base=hex2rgb(S.bg), ac=hex2rgb(S.accent);
 const bgc=bgOf(b), surf=bgc||base;
 let fg=ratio(surf,D)>=ratio(surf,W)?D:W;
 if(b.type==='hero'&&b.bgsrc&&IMGS[b.bgsrc])fg=W;
 const dark=fg===W;
 const cardc=dark?mix(surf,W,.09):(lum(surf)>.93?mix(surf,[0,0,0],.04):mix(surf,W,.65));
 let bb=ac; if(ratio(bb,surf)<2.2)bb=fg;
 return{
  bgc:bgc?rgb(bgc):'transparent', bgc2:rgb(cardc), fg:rgb(fg), mute:rgb(mix(surf,fg,.66)), line:rgb(mix(surf,fg,.14)), bd:rgb(mix(surf,fg,.3)),
  card:rgb(cardc), ph:rgb(mix(surf,fg,dark?.15:.07)), bb:rgb(bb), bt:rgb(ratio(bb,D)>=ratio(bb,W)?D:W),
  ac:rgb(ratio(ac,surf)>=2.6?ac:fg), inbg:rgb(dark?mix(surf,W,.07):W), sun:dark?'#ff9a9a':'#d9363e', sat:dark?'#9fbfff':'#2f6fd6'
 };
}

function blockStyle(b){
 const v=bv(b);
 let st=`--bgc:${v.bgc};--bgc2:${v.bgc2};--fg:${v.fg};--mute:${v.mute};--line:${v.line};--bd:${v.bd};--card:${v.card};--ph:${v.ph};--bt-b:${v.bb};--bt-f:${v.bt};--ac:${v.ac};--inbg:${v.inbg};--sun:${v.sun};--sat:${v.sat};--py:var(--p-${b.pad||'m'});`;
 if(b.type==='hero'){
  st+=`--hh:${{s:240,m:340,l:460}[b.size]||340}px;`;
  if(b.bgsrc&&IMGS[b.bgsrc])st+=`background-image:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42)),url('${IMGS[b.bgsrc]}');background-size:cover;background-position:center;`;
 }
 return st;
}
function blockHTML(b,pg){

 if(b.type==='hero'){
  st+=`--hh:${{s:240,m:340,l:460}[b.size]||340}px;`;
  if(b.bgsrc&&IMGS[b.bgsrc])st+=`background-image:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42)),url('${IMGS[b.bgsrc]}');background-size:cover;background-position:center;`;
 }

 return `<section class="blk t-${b.type}" data-id="${b.id}" style="${st}">${B[b.type](b,v,pg)}${bar}</section>`;

function tipHTML(){

function pageInner(pg,tip){

function applySite(){

  h+=`<div class="ptabs">${S.pages.map(p=>`<button type="button" class="ptab ${p.id===S.cur?'on':''}" data-pg="${p.id}">${esc(p.name||'이름 없음')}${p.inMenu===false?'<small>메뉴 밖</small>':''}</button>`).join('')}<button type="button" class="ptab add" data-padd="1">+ 빈 페이지</button></div>`;

 }

const tinp=(path,val,ph)=>`<input class="tin" type="text" data-txt="${path}" value="${esc(val)}" placeholder="${esc(ph||'')}">`;
function swatches(k,list,curv,withNone){
 const items=(withNone?[['','','없음',true]]:[]).concat(list);
 const isHex=/^#/.test(curv)&&!list.some(x=>x[0]===curv);
 return `<div class="sws">${items.map(x=>`<button type="button" class="sw ${x[3]?'none':''} ${curv===x[0]?'on':''}" data-set="${k}" data-v="${x[0]}" style="--c:${x[1]}" title="${x[2]}" aria-label="${x[2]}"></button>`).join('')}<label class="sw custom ${isHex?'on':''}" title="직접 고르기"><input type="color" data-color="${k}" value="${/^#[0-9a-f]{6}$/i.test(curv)?curv:'#888888'}" aria-label="직접 고르기"></label></div>`;
}
function listEd(path,arr,o){
 o=o||{};
 const rows=arr.map((it,i)=>{
  let ins;
  if(o.fields)ins=o.fields.map(f=>`<input class="tin${f[2]?' num':''}" type="${f[2]?'number':'text'}"${f[2]?' data-num="1"':''} value="${esc(it[f[0]])}" data-txt="${path}.${i}.${f[0]}" placeholder="${f[1]}" aria-label="${f[1]}">`).join('');
  else ins=`<input class="tin" type="text" value="${esc(it)}" data-txt="${path}.${i}" placeholder="${o.ph||''}" aria-label="${o.ph||''}">`;
  if(o.stack)ins=`<div class="lstack">${ins}</div>`;
  return `<div class="lrow">${ins}<button class="ib" type="button" data-del="${path}" data-i="${i}" ${arr.length<=(o.min||0)?'disabled':''} aria-label="삭제">×</button></div>`;

}

function save(){ try{localStorage.setItem(KEY,JSON.stringify({S:S,IMGS:IMGS}))}catch(e){} }
function commit(){
 const j=JSON.stringify(S); if(j===hist[hi])return;
 hist=hist.slice(0,hi+1); hist.push(j); if(hist.length>80)hist.shift(); hi=hist.length-1;
 updUndo(); save();
}
function updUndo(){ $('#undo').disabled=hi<=0; $('#redo').disabled=hi>=hist.length-1; }
function restore(){ S=JSON.parse(hist[hi]); if(selId&&!byId(selId))selId=null; updUndo(); renderAll(); save(); }
function undo(){ if(hi>0){hi--;restore()} }
function redo(){ if(hi<hist.length-1){hi++;restore()} }
function setKV(k,v,live){
 if(v==='true')v=true; else if(v==='false')v=false; else if(k==='n')v=+v;
 if(k==='site.mode'){setMode(v);return}
 if(k==='site.who'){S.who=v;S.sync=v==='class'?'firebase':'demo';renderPage();commit();renderPanel();toast(v==='class'?'학급 아이들과 함께 쓰는 사이트예요. 프롬프트에 Firebase SDK 키 설정이 들어가요.':'나 혼자 쓰는 사이트예요. 서버 없이 이 기기에 저장하도록 요청해요.');return}
 if(k.indexOf('site.')===0){ S[k.slice(5)]=v; if((k==='site.showNav'&&!v&&selId===S.nav.id)||(k==='site.showFooter'&&!v&&selId===S.footer.id))selId=null; }
 else{ const b=cur(); if(!b)return; b[k]=v; if(k==='n'&&(b.type==='cards'||b.type==='gallery'))fitCount(b); }
 renderPage(); if(!live){commit();renderPanel()}
}
function fitCount(b){

function setMode(m){
 if(m===S.mode)return;
 if(m==='one'){
  const menu=S.pages.filter(p=>p.inMenu!==false).map(p=>p.name);
  if(S.pages.length>1){
   const first=S.pages[0]; S.pages.slice(1).forEach(p=>{first.blocks=first.blocks.concat(p.blocks)}); S.pages=[first];
   toast('페이지들을 한 페이지로 합쳤어요. 되돌리기로 돌아갈 수 있어요.');
  }
  if(menu.length)S.nav.items=menu.slice(0,7);
 }else{
  const first=S.pages[0], keep=[], made=[];
  first.blocks.forEach(b=>{ if(FEAT[b.type]){const nm=FEAT_PAGE[b.type];const p=mkPage(made.some(x=>x.name===nm)||nm===first.name?nm+' '+(made.length+2):nm,[b],!HIDDEN_PAGE(b.type));made.push(p)} else keep.push(b) });
  first.blocks=keep; S.pages=[first].concat(made);
  toast(made.length?`학급 기능 ${made.length}개를 각각 페이지로 나눴어요. 되돌리기로 돌아갈 수 있어요.`:'멀티페이지로 바꿨어요. 학급 기능을 누르면 새 페이지가 생겨요.');
 }
 S.mode=m; S.cur=S.pages[0].id; commit(); renderAll();
}

function addBlock(type){

   const nb=mk(type), name=uniqName(FEAT_PAGE[type]), p=mkPage(name,[nb],!HIDDEN_PAGE(type));

const fileIn=$('#file'); let pending=null;
function pickImage(id,path){ pending={id:id,path:path}; fileIn.value=''; fileIn.click(); }
function fileToKey(file){
 return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
   im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    const k='i'+(++imgN);IMGS[k]=c.toDataURL('image/jpeg',.84);res(k)};
   im.onerror=rej; im.src=fr.result};
  fr.onerror=rej; fr.readAsDataURL(file);
 });
}
async function setImage(id,path,file){
 try{ const key=await fileToKey(file); const b=byId(id); if(!b)return; setP(b,path,key); commit(); renderPage(); renderPanel(); }

 return sc+`<button class="ub pri" type="button" id="m-copy">${ico('copy',16)}이미지 복사</button><button class="ub" type="button" id="m-save">${ico('pic',16)}PNG 저장</button><span class="hint">복사한 뒤 AI 채팅창에 붙여넣기(Ctrl+V) 하세요. [모든 페이지 한 장]은 페이지 구성을 한눈에 보여 줄 때 좋아요.</span>`;

async function makeImage(scope){
 if(typeof html2canvas!=='function'){toast('이미지 만드는 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return}
 imgScope=scope||'cur'; if(!(S.mode==='multi'&&S.pages.length>1))imgScope='cur';
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 modal('디자인 이미지','<p class="hint" style="text-align:center;padding:40px 0">이미지를 만드는 중이에요…</p>','');
 const width=S.view==='mobile'?390:860;
 const wrap=document.createElement('div');
 let target, bg=S.bg;
 if(imgScope==='all'){
  wrap.style.cssText='position:fixed;left:-100000px;top:0;display:flex;align-items:flex-start;gap:48px;padding:40px;background:#e6e9e6;width:max-content;font-family:"Noto Sans KR",sans-serif;';
  S.pages.forEach((p,i)=>{const col=document.createElement('div');
   const lab=document.createElement('div'); lab.style.cssText='font:700 26px "Noto Sans KR",sans-serif;color:#1d2420;margin:0 0 14px 4px;';
   lab.textContent=`${i+1}. ${p.name}${p.inMenu===false?' (메뉴 밖)':''}`;
   col.appendChild(lab); col.appendChild(exportPage(p,width)); wrap.appendChild(col)});
  target=wrap; bg='#e6e9e6';
 }else{
  wrap.style.cssText=`position:fixed;left:-100000px;top:0;width:${width}px;`;
  wrap.appendChild(exportPage(curPage(),width)); target=wrap.firstChild;
 }
 document.body.appendChild(wrap);
 try{
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const w=target.scrollWidth||width,h=target.scrollHeight||target.offsetHeight;
  let scale=Math.min(2,15000/Math.max(w,h),Math.sqrt(60e6/(w*h))); scale=Math.max(.4,scale);
  const canvas=await html2canvas(target,{scale:scale,backgroundColor:bg,useCORS:true,logging:false,windowWidth:Math.max(width,w)});
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  if(!blob)throw new Error('empty');
  if(lastUrl)URL.revokeObjectURL(lastUrl);
  lastBlob=blob; lastUrl=URL.createObjectURL(blob);
  modal(imgScope==='all'?'디자인 이미지 · 모든 페이지':`디자인 이미지 · ${S.mode==='multi'?curPage().name:'원페이지'}`,`<img src="${lastUrl}" alt="만든 웹페이지 디자인 이미지" style="width:${imgScope==='all'?'100%':Math.min(width,860)+'px'}">`,imgFoot());
 }catch(err){
  modal('디자인 이미지','<p class="hint" style="padding:24px 0">이미지를 만들지 못했어요. 사진 파일을 줄이거나 블록 수를 줄여서 다시 시도해 주세요.</p>','');
 }finally{ wrap.remove(); }
}

};

const A3={left:'왼쪽 정렬',center:'가운데 정렬',right:'오른쪽 정렬'};

const q=s=>`"${String(s).replace(/\n/g,' ')}"`;
const slug=i=>i===0?'home':'page'+(i+1);
function line(b){
 const bgt=b.bg?`, 배경 ${bgName(b.bg)}`:'';
 const ph=(src,alt)=>src&&IMGS[src]?`실제 사진(${alt})`:`사진 자리(들어갈 사진: ${alt})`;
 switch(b.type){
  case 'hero':return `히어로 섹션(큰 배너, 높이 ${{s:'낮게',m:'보통',l:'높게'}[b.size]}, ${A3[b.align]}${b.bgsrc&&IMGS[b.bgsrc]?', 배경에 사진을 깔고 어둡게 덮기':bgt}) — 제목 ${q(b.title)}, 설명 ${q(b.sub)}${b.showBtn!==false?`, 버튼 ${q(b.btn)}`:''}`;
  case 'heading':return `제목(${A3[b.align]}) — ${q(b.text)}`;
  case 'text':return `문단(${A3[b.align]}${bgt}) — ${q(b.text)}`;
  case 'image':return `사진(${({wide:'16:9 와이드',photo:'3:2 가로',square:'정사각',tall:'3:4 세로'})[b.ratio]}) — ${ph(b.src,b.alt)}`;
  case 'imgtext':return `사진+글(사진이 ${b.flip?'오른쪽':'왼쪽'}${bgt}) — ${ph(b.src,b.alt)}, 제목 ${q(b.title)}, 설명 ${q(b.text)}`;
  case 'cards':return `카드 ${b.n}개를 그리드로 가로 배치(${S.mode==='multi'&&b.items.some(c=>S.pages.some(p=>p.name===c.title))?'카드 제목과 같은 이름의 메뉴로 이동하는 바로가기, ':''}${b.thumbs!==false?'위쪽에 사진 자리':'글만'}${bgt}) — `+b.items.map(c=>`[${c.title}: ${c.text}${b.thumbs!==false?` / 사진: ${c.alt}`:''}]`).join(' ');
  case 'gallery':return `사진 갤러리(${b.n}칸 그리드, 누르면 크게 보는 모달) — `+b.items.map(c=>c.alt).join(' · ');
  case 'button':return `버튼(${A3[b.align]}, ${b.bstyle==='line'?'테두리형':'채움형'}) — ${q(b.btn)}`;
  case 'quote':return `인용구(${A3[b.align]}${bgt}) — ${q(b.text)} / ${b.who}`;
  case 'divider':return `구분선(${{line:'가는 선',dashed:'점선',thick:'짧고 굵은 포인트 선'}[b.style]})`;
  case 'form':return `입력 폼${bgt} —제목 ${q(b.title)}, 입력 항목 ${b.fields.join(' · ')}, 버튼 ${q(b.btn)}`;
 }

 },
 admin:(b,r)=>{
  if(!r.ok)return `<div class="fx login"><span class="admlock" style="align-self:center">${ico('admin',30)}</span><h3 class="hd lt">${esc(b.title)}</h3><p class="lsub" style="margin:0">${b.pwOn?'관리자 비밀번호를 입력해 주세요.':'선생님으로 로그인한 사람만 들어올 수 있어요.'}</p>${b.pwOn?pin('비밀번호','apw','password','adminin'):''}${r.err?`<div class="pv-err">${esc(r.err)}</div>`:''}<button class="btn wide" data-a="adminin">들어가기</button>${b.pwOn?`<div class="pv-demo">미리보기 비밀번호: <b>${esc(r.pw||b.pw)}</b></div>`:''}</div>`;
  const feats=[],mods=[];

   if(FEAT[x.type]&&x.type!=='admin'&&x.type!=='login')feats.push([p,x]);
   if(x.type==='board')rtOf(x).posts.forEach((q2,i)=>mods.push({b:x.id,i:i,k:'게시판',t:q2.title,a:q2.author,h:q2.hidden}));
   if(x.type==='guestbook')rtOf(x).notes.forEach((q2,i)=>mods.push({b:x.id,i:i,k:'한마디',t:q2.text,a:q2.name,h:q2.hidden}));
  }));
  const secs=[];

  if(b.roster)secs.push(`<div class="adm-tile"><b>학생 명단 · ${r.roster.length}명</b><div class="adm-chips">${r.roster.map((n,i)=>`<span class="chip">${i+1}. ${esc(n)}<button class="x" data-a="rosdel" data-i="${i}" aria-label="${esc(n)} 빼기">×</button></span>`).join('')}</div>${rowIn('ros','rosadd','이름 추가')}</div>`);
  if(b.moderate)secs.push(`<div class="adm-tile"><b>글 관리 · ${mods.length}개</b>${mods.length?mods.slice(0,8).map(m=>`<div class="adm-row"><span class="${m.h?'done':''}">[${m.k}] ${esc(m.t)} <small class="meta">${esc(m.a)}</small></span><span class="pbtns"><button class="pbtn w2" data-a="modhide" data-b2="${m.b}" data-i="${m.i}">${m.h?'보이기':'숨기기'}</button><button class="pbtn w2" data-a="moddel" data-b2="${m.b}" data-i="${m.i}">삭제</button></span></div>`).join(''):'<span class="meta">관리할 글이 없어요.</span>'}</div>`);
  if(b.backup)secs.push(`<div class="adm-tile"><b>백업·초기화</b><small>새 학기에는 백업한 뒤 비우고 시작해요.</small><div class="row"><button class="btn sm line" data-a="backup">백업 파일 만들기</button><button class="btn sm ${r.wipe?'':'line'}" data-a="wipe">${r.wipe?'한 번 더 누르면 초기화':'전체 초기화'}</button></div></div>`);
  if(b.pwOn)secs.push(`<div class="adm-tile"><b>관리자 비밀번호 바꾸기</b><small>지금 비밀번호: ${esc(r.pw||b.pw)}</small>${rowIn('npw','pwchg','새 비밀번호','변경')}</div>`);
  return `<div class="fx"><div class="fx-h"><div class="fx-t"><h3 class="hd">${esc(b.title)}</h3>${chips(['관리자 모드'])}</div><button class="btn sm line" data-a="adminout">관리자 나가기</button></div><div class="adm-grid">${secs.join('')||'<div class="empty2">관리 기능이 모두 꺼져 있어요.</div>'}</div></div>`;
 },
 form:(b)=>`<div class="form"><h3 class="hd">${esc(b.title)}</h3>${b.fields.map(f=>`<label class="fld"><span class="fl">${esc(f)}</span>${/말|메시지|내용|문의|의견/.test(f)?'<textarea class="inp"></textarea>':'<input class="inp" autocomplete="off">'}</label>`).join('')}<div class="btnrow a-center"><button class="btn" data-a="fsend">${esc(b.btn)}</button></div></div>`
};
function pvContent(b,pg){
 return B[b.type](b,bv(b),pg).replace(/ contenteditable="true"/g,'').replace(/ spellcheck="false"/g,'')
  .replace(/<button class="imgbtn ui-only"[^>]*>[^<]*<\/button>/g,'')
  .replace(/<span class="btn/g,'<span data-a="btn" role="button" tabindex="0" class="btn');
}
function pvNav(pg){
 const b=S.nav;
 const items=S.mode==='multi'
  ?S.pages.filter(p=>p.inMenu!==false).map(p=>`<span class="mi${p.id===pg.id?' on':''}" data-a="go" data-v="${p.id}" role="link" tabindex="0">${esc(p.name)}</span>`).join('')
  :b.items.map((t,i)=>`<span class="mi" data-a="jump" data-v="${i}" role="link" tabindex="0">${esc(t)}</span>`).join('');
 const right=PV.user?`<span class="uname">${esc(PV.user.name)}${/님$/.test(PV.user.name)?'':'님'}</span><button class="btn sm line" data-a="logout">로그아웃</button>`:(b.loginBtn?'<button class="btn sm" data-a="login">로그인</button>':'');
 return `<section class="blk t-nav" style="${blockStyle(b)}"><div class="nav-in"><span class="brand" data-a="home" role="link" tabindex="0" style="cursor:pointer">${esc(b.brand)}</span><div class="nav-r"><div class="menu">${items}</div>${right}<button class="burger" data-a="burger" aria-label="메뉴 열기" aria-expanded="${!!PV.menu}"><i></i><i></i><i></i></button></div></div>${PV.menu?`<div class="mmenu">${items}</div>`:''}</section>`;
}
function pvRender(top){
 if(!PV)return;
 const body=$('#pvBody'),pg=pvPage(),el=$('#pvPage'),st=body.scrollTop;
 el.style.cssText=page.style.cssText;
 let h=S.showNav?pvNav(pg):'';
 pg.blocks.forEach(b=>{h+=`<section class="blk t-${b.type}" data-bid="${b.id}" style="${blockStyle(b)}">${PVB[b.type]?PVB[b.type](b,rtOf(b)):pvContent(b,pg)}</section>`});
 if(!pg.blocks.length)h+='<div class="empty2" style="padding:90px 20px">이 페이지는 아직 비어 있어요.</div>';
 if(S.showFooter)h+=`<section class="blk t-footer" style="${blockStyle(S.footer)}">${pvContent(S.footer,pg)}</section>`;
 if(PV.loginOpen){const c=pvLoginCfg();h+=`<div class="pv-ov" data-ov="1"><section class="blk t-login" data-bid="${c.id}" style="${blockStyle(c)}"><button class="x" data-a="ovclose" aria-label="닫기">×</button>${PVB.login(c,rtOf(c))}</section></div>`}
 el.innerHTML=h;
 el.querySelectorAll('.card').forEach(c=>{const t=c.querySelector('h3');if(t&&pageByName(t.textContent.trim()))c.classList.add('go')});
 $('#pvHash').textContent='/#'+(S.mode==='multi'?slug(S.pages.indexOf(pg)):'home');
 $('#pvBack').disabled=PV.hpos<=0; $('#pvFwd').disabled=PV.hpos>=PV.hist.length-1;
 $('#pvWho').value=PV.user?PV.user.role:'guest';
 body.scrollTop=top?0:st;
 if(PV.focus){const f=el.querySelector(PV.focus);PV.focus=null;if(f){f.focus();if(f.select)f.select()}}
}
function pvSetView(v){
 PV.view=v; const body=$('#pvBody'); body.className='pv-body '+(v==='mobile'?'m':'pc'); body.style.setProperty('--sbgx',S.bg);
 pvRoot.querySelectorAll('[data-a="view"]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
}
function pvGo(pid){
 PV.menu=false; PV.loginOpen=false;
 if(pid!==PV.cur){PV.hist=PV.hist.slice(0,PV.hpos+1);PV.hist.push(pid);PV.hpos=PV.hist.length-1;PV.cur=pid}
 pvRender(true);
}
function pvJump(i){
 const name=(S.nav.items[i]||'').trim(), bl=pvPage().blocks;
 let j=bl.findIndex(b=>{const t=[b.title,b.text,BN[b.type]].filter(Boolean).join(' ');return name&&(t.indexOf(name)>=0||name.indexOf(BN[b.type])>=0)});
 if(j<0)j=Math.min(i+1,bl.length-1);
 PV.menu=false; pvRender();
 const t=bl[j]&&$('#pvPage').querySelector(`[data-bid="${bl[j].id}"]`); if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
 $('#pvHash').textContent='/#'+(bl[j]?bl[j].type:'home');
}
function pvLogin(b,r,val){
 const f1=val('f1'),f2=val('f2'); let acc=null,err='';
 if(b.method==='numname'){ if(!f1||!f2)err='번호와 이름을 모두 적어 주세요.'; else acc={name:f2,role:b.roles?r.role:(f1==='0'?'teacher':'student')}; }
 else if(b.method==='code'){ acc=f1==='1111'?{name:'학생',role:'student'}:f1==='9999'?{name:'선생님',role:'teacher'}:null; if(!acc)err=f1?'입장 코드가 맞지 않아요.':'입장 코드를 적어 주세요.'; }
 else{ const a=PV.accounts.find(x=>x.id===f1&&x.pw===f2); if(a)acc={name:a.name,role:a.role}; else err=f1&&f2?'아이디나 비밀번호가 맞지 않아요.':'아이디와 비밀번호를 적어 주세요.'; }
 if(acc&&b.roles&&b.method!=='numname'&&acc.role!==r.role){err=acc.role==='teacher'?'선생님 계정은 [선생님] 탭에서 로그인해요.':'학생 계정은 [학생] 탭에서 로그인해요.';acc=null}
 if(!acc){r.err=err;pvRender();return}
 r.err=''; PV.user=acc; PV.loginOpen=false; toast(`${acc.name}${/님$/.test(acc.name)?'':'님'}, 로그인했어요.`);
 if(S.mode==='multi'&&pvPage().blocks.some(x=>x.type==='login')){pvGo(S.pages[0].id);return}
 pvRender();
}
function readImg(file){
 return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)});
}
function pvAct(a,el){
 if(!PV)return;
 const bel=el.closest?el.closest('[data-bid]'):null, b=bel?pvB(bel.dataset.bid):null, r=b?rtOf(b):null;
 const val=n=>{const x=bel&&bel.querySelector(`[data-n="${n}"]`);return x?x.value.trim():''};
 const fx=n=>{PV.focus=`[data-bid="${b.id}"] [data-n="${n}"]`};
 const i=+el.dataset.i;
 switch(a){
  case 'close':closePreview();return;
  case 'back':if(PV.hpos>0){PV.hpos--;PV.cur=PV.hist[PV.hpos];PV.menu=false;pvRender(true)}return;
  case 'fwd':if(PV.hpos<PV.hist.length-1){PV.hpos++;PV.cur=PV.hist[PV.hpos];PV.menu=false;pvRender(true)}return;
  case 'reload':PV.rt={};PV.user=null;PV.accounts=ACCTS0();PV.loginOpen=false;PV.menu=false;toast('처음 상태로 되돌렸어요.');pvRender(true);return;
  case 'view':pvSetView(el.dataset.v);return;
  case 'go':pvGo(el.dataset.v);return;
  case 'home':if(S.mode==='multi')pvGo(S.pages[0].id);else{PV.menu=false;pvRender(true)}return;
  case 'jump':pvJump(+el.dataset.v);return;
  case 'burger':PV.menu=!PV.menu;break;
  case 'login':case 'gologin':{if(S.mode==='multi'){const lp=loginPage();if(lp){pvGo(lp.id);return}}PV.loginOpen=true;PV.menu=false;PV.focus='.pv-ov [data-n="f1"]';break}
  case 'ovclose':PV.loginOpen=false;break;
  case 'logout':PV.user=null;toast('로그아웃했어요.');break;
  case 'btn':{const t=el.textContent.trim();const p=S.mode==='multi'&&S.pages.find(x=>x.name&&t.indexOf(x.name)>=0);if(p){pvGo(p.id);return}toast('이 버튼이 어디로 갈지는 AI가 만들 때 정해요.');return}
  case 'role':r.role=el.dataset.v;r.err='';break;
  case 'dologin':pvLogin(b,r,val);return;
  case 'signup':r.mode='signup';r.err='';PV.focus=`[data-bid="${b.id}"] [data-n="sn"]`;break;
  case 'tologin':r.mode='login';r.err='';break;
  case 'dosignup':{const n=val('sn'),id=val('si'),pw=val('sp');
   if(!n||!id||!pw){r.err='이름, 아이디, 비밀번호를 모두 적어 주세요.';break}
   if(PV.accounts.some(x=>x.id===id)){r.err='이미 있는 아이디예요. 다른 아이디를 써 주세요.';break}
   PV.accounts.push({id:id,pw:pw,name:n,role:b.roles&&r.role==='teacher'?'teacher':'student'});r.mode='login';r.err='';toast('가입했어요. 방금 만든 아이디로 로그인해 보세요.');break}
  case 'bwrite':if(!guard(b))return;r.view='write';r.err='';r.dt='';r.dc='';r.dph='';fx('t');break;
  case 'bcancel':r.view='list';break;
  case 'bsave':{const t=val('t'),c=val('c');if(!t){r.err='제목을 적어 주세요.';r.dc=c;fx('t');break}
   const d=new Date();r.posts.unshift({id:r.next++,title:t,body:c||'(내용 없음)',author:PV.user?PV.user.name:'익명',owner:meKey(),date:`${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`,likes:0,liked:false,photo:r.dph,comments:[]});
   r.view='list';r.pg=1;r.dph='';toast('글을 올렸어요.');break}
  case 'bread':r.read=+el.dataset.v;r.view='read';break;
  case 'blist':r.view='list';break;
  case 'bpage':r.pg=+el.dataset.v;break;
  case 'blike':{if(!guard(b))return;const p=r.posts.find(x=>x.id===r.read);if(p){p.liked=!p.liked;p.likes+=p.liked?1:-1}break}
  case 'bdel':r.posts=r.posts.filter(x=>x.id!==r.read);r.view='list';toast('글을 지웠어요.');break;
  case 'bcmt':{if(!guard(b))return;const t=val('cm');if(!t)return;const p=r.posts.find(x=>x.id===r.read);if(p)p.comments.push({name:PV.user?PV.user.name:'익명',owner:meKey(),text:t});fx('cm');break}
  case 'bcdel':{const p=r.posts.find(x=>x.id===r.read);if(p)p.comments.splice(i,1);break}
  case 'vote':{if(!guard(b))return;const ch=[].slice.call(bel.querySelectorAll('[data-n="o"]:checked')).map(x=>+x.value);
   if(!ch.length){toast('선택지를 먼저 골라 주세요.');return}
   ch.forEach(k=>{r.counts[k]++;r.voters[k].push(PV.user?PV.user.name:'나')});r.sel=ch;r.voted=true;toast('투표했어요!');break}
  case 'vclose':r.closed=!r.closed;toast(r.closed?'투표를 마감했어요.':'투표를 다시 열었어요.');break;
  case 'nprev':if(r.idx>0)r.idx--;break;
  case 'nnext':if(r.idx<r.pages.length-1)r.idx++;break;
  case 'nconf':r.me=!r.me;r.cnt+=r.me?1:-1;break;
  case 'nadd':{if(!guard(b))return;const t=val('ni');if(!t)return;r.pages[r.idx].items.push(t);fx('ni');break}
  case 'ndel':if(!guard(b))return;r.pages[r.idx].items.splice(i,1);break;
  case 'cprev':r.m--;if(r.m<1){r.m=12;r.y--}r.sel=null;break;
  case 'cnext':r.m++;if(r.m>12){r.m=1;r.y++}r.sel=null;break;
  case 'csel':r.sel=+el.dataset.v;break;
  case 'cadd':{if(!guard(b))return;const t=val('ce');if(!t||!r.sel)return;const k=`${r.y}-${r.m}-${r.sel}`;(r.ev[k]=r.ev[k]||[]).push(t);fx('ce');break}
  case 'cdel':{if(!guard(b))return;const k=`${r.y}-${r.m}-${r.sel}`;if(r.ev[k])r.ev[k].splice(i,1);break}
  case 'tted':if(!guard(b))return;r.edit=[+el.dataset.p,+el.dataset.d];fx('tt');break;
  case 'ttsave':{if(!r||!r.edit)return;const x=bel.querySelector('[data-n="tt"]');r.cells[r.edit[0]][r.edit[1]]=x?x.value.trim():'';r.edit=null;break}
  case 'pinc':{if(!guard(b))return;const it=r.items[i];it.score=Math.max(0,it.score+(+el.dataset.v));break}
  case 'gadd':{if(!guard(b))return;const t=val('g');if(!t)return;
   r.notes.unshift({text:t.slice(0,100),name:PV.user?PV.user.name:'방문자',owner:meKey(),ok:!b.approve||isT(),c:r.cc++});
   if(b.approve&&!isT())toast('선생님이 승인하면 모두에게 보여요.');fx('g');break}
  case 'gdel':r.notes.splice(i,1);break;
  case 'gok':r.notes[i].ok=true;break;
  case 'tdtog':if(!guard(b))return;r.items[i].done=!r.items[i].done;if(r.items.every(x=>x.done))toast('할 일을 모두 끝냈어요!');break;
  case 'tdadd':{if(!guard(b))return;const t=val('td');if(!t)return;r.items.push({text:t,done:false});fx('td');break}
  case 'tddel':if(!guard(b))return;r.items.splice(i,1);break;
  case 'adminin':{if(b.pwOn){if(val('apw')!==(r.pw||b.pw)){r.err=val('apw')?'비밀번호가 맞지 않아요.':'비밀번호를 입력해 주세요.';fx('apw');break}}else if(!isT()){r.err='선생님으로 로그인해야 들어올 수 있어요.';break}
   r.ok=true;r.err='';toast('관리자 화면에 들어왔어요.');break}
  case 'adminout':r.ok=false;r.wipe=false;break;
  case 'rosadd':{const t=val('ros');if(!t)return;r.roster.push(t);fx('ros');break}
  case 'rosdel':r.roster.splice(i,1);break;
  case 'modhide':{const bb=pvB(el.dataset.b2),rr=rtOf(bb),x=(bb.type==='board'?rr.posts:rr.notes)[i];if(x){x.hidden=!x.hidden;toast(x.hidden?'숨겼어요. 학생 화면에서 안 보여요.':'다시 보이게 했어요.')}break}
  case 'moddel':{const bb=pvB(el.dataset.b2),rr=rtOf(bb);(bb.type==='board'?rr.posts:rr.notes).splice(i,1);toast('지웠어요.');break}
  case 'pwchg':{const t=val('npw');if(!t)return;r.pw=t;toast('비밀번호를 바꿨어요. (미리보기에서만)');break}
  case 'backup':toast('백업 파일(JSON)을 내려받아요. 미리보기라서 실제 파일은 만들지 않아요.');return;
  case 'wipe':if(!r.wipe){r.wipe=true;break}Object.keys(PV.rt).forEach(k=>{if(k!==b.id)delete PV.rt[k]});r.wipe=false;toast('모든 데이터를 초기화했어요.');break;
  case 'goadmin':{const ap=adminPage();if(!ap)return;if(S.mode==='multi'){pvGo(ap.id);return}const bl=ap.blocks.find(x=>x.type==='admin');PV.menu=false;pvRender();const t=$('#pvPage').querySelector(`[data-bid="${bl.id}"]`);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
  case 'fsend':bel.querySelectorAll('.inp').forEach(x=>{x.value=''});toast('보냈어요! (미리보기라서 실제로 보내지지는 않아요)');return;
  default:return;
 }

 });
 if(w.admin.length)s.pages.push(mkPage('관리자',[mk('admin',{pwOn:w.admin.indexOf('pw')>=0,pw:(w.pw||'').trim()||'0000',perms:w.admin.indexOf('perms')>=0,roster:w.admin.indexOf('roster')>=0,moderate:w.admin.indexOf('moderate')>=0,backup:w.admin.indexOf('backup')>=0})],false));
 if(w.who==='solo')s.pages.forEach(p=>p.blocks.forEach(b=>{if(FEAT[b.type]){b.store='local';if(!HIDDEN_PAGE(b.type))b.perm='all'}}));
 s.cur=s.pages[0].id; return s;
}
wzRoot.addEventListener('click',e=>{
 if(!WZ)return; const el=e.target.closest('[data-w]'); if(!el||el.disabled)return;
 const a=el.dataset.w, v=el.dataset.v, i=+el.dataset.i;
 switch(a){
  case 'who':WZ.who=v;if(!WZ.admTouched)WZ.admin=v==='solo'?['pw']:['pw','perms','moderate'];wzRender();setTimeout(()=>{if(WZ&&WZ.step===0&&WZ.who===v){WZ.step=1;wzRender()}},280);return;
  case 'next':if(WZ.step===0&&!WZ.who)return;WZ.step=Math.min(WQ.length-1,WZ.step+1);break;
  case 'prev':WZ.step=Math.max(0,WZ.step-1);break;
  case 'ftog':WZ.feats[i].on=!WZ.feats[i].on;WZ.skip=false;break;
  case 'up':case 'down':{const j=i+(a==='up'?-1:1);if(j<0||j>=WZ.feats.length)return;const t=WZ.feats[i];WZ.feats[i]=WZ.feats[j];WZ.feats[j]=t;break}
  case 'info':WZ.info[v]=!WZ.info[v];if(!WZ.info.notice&&!WZ.info.timetable&&!WZ.info.calendar){WZ.info[v]=true;toast('정보 알리미에는 하나 이상 들어가야 해요. 빼려면 체크를 끄세요.')}break;
  case 'skip':WZ.skip=!WZ.skip;break;
  case 'home':{const k=WZ.home.indexOf(v);if(k>=0)WZ.home.splice(k,1);else WZ.home.push(v);break}
  case 'adm':{WZ.admTouched=true;const k=WZ.admin.indexOf(v);if(k>=0)WZ.admin.splice(k,1);else WZ.admin.push(v);break}
  case 'noadmin':WZ.admTouched=true;WZ.admin=[];break;
  case 'acc':WZ.accent=v;break;
  case 'skipall':S=TPL.start();IMGS={};selId=null;tab='block';closeWizard();commit();scroller.scrollTop=0;renderAll();toast('홈만 있는 사이트로 시작해요. 리본의 학급 기능으로 하나씩 더해 보세요.');return;
  case 'make':{const fn=wzFeats().length;S=buildSite(WZ);IMGS={};selId=null;tab='block';closeWizard();commit();scroller.scrollTop=0;renderAll();
   toast(`페이지 ${S.pages.length}개를 만들었어요. 이제 블록을 눌러 세부 설정을 하고, [미리보기]로 써 보세요.`+(fn?'':' 기능은 리본에서 추가해요.'));return}
  default:return;
 }
 wzRender();
});
wzRoot.addEventListener('input',e=>{ if(!WZ)return; const f=e.target.dataset&&e.target.dataset.wf; if(!f)return; WZ[f]=e.target.value; const sd=$('#wzSide'); if(sd)sd.innerHTML=wzSide(); });
let wzDrag=null;
wzRoot.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('.wz-row');if(!r)return;wzDrag=+r.dataset.wi;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(wzDrag))}catch(_){}setTimeout(()=>r.classList.add('dragging'),0)});
wzRoot.addEventListener('dragover',e=>{if(wzDrag===null)return;const r=e.target.closest('.wz-row');if(!r)return;e.preventDefault();wzRoot.querySelectorAll('.wz-row.over').forEach(x=>x.classList.remove('over'));r.classList.add('over')});
wzRoot.addEventListener('drop',e=>{if(wzDrag===null)return;const r=e.target.closest('.wz-row');e.preventDefault();if(r){const to=+r.dataset.wi;const it=WZ.feats.splice(wzDrag,1)[0];WZ.feats.splice(to,0,it)}wzDrag=null;wzRender()});
wzRoot.addEventListener('dragend',()=>{wzDrag=null;if(WZ)wzRender()});

/* ---------- 시작 ---------- */
function boot(){
 let ok=false;
 try{
  const raw=localStorage.getItem(KEY);
  if(raw){const d=JSON.parse(raw); if(d&&d.S&&Array.isArray(d.S.pages)&&d.S.pages.length&&d.S.nav&&d.S.footer){S=d.S;IMGS=d.IMGS||{};ok=true}}
 }catch(e){}
 if(!ok){S=TPL.start();IMGS={};setTimeout(openWizard,0)}
 const ids=allBlocks().map(b=>b.id).concat(S.pages.map(p=>p.id));
 uid=Math.max.apply(null,[0].concat(ids.map(x=>parseInt(String(x).slice(1),10)||0)));
 imgN=Math.max.apply(null,[0].concat(Object.keys(IMGS).map(k=>parseInt(k.slice(1),10)||0)));
 if(!S.pages.some(p=>p.id===S.cur))S.cur=S.pages[0].id;
 if(!S.sync)S.sync='firebase';
 commit(); renderAll(); updUndo();
}
boot();
})();
</script>
